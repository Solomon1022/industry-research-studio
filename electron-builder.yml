appId: com.solomon.industryresearchstudio
productName: Industry Research Studio
copyright: Copyright © 2026 Solomon Zhang
asar: true
npmRebuild: false
directories:
  output: release
files:
  - dist-electron/**
  - package.json
extraResources:
  - from: .next/standalone
    to: next-standalone
  - from: .next/static
    to: next-standalone/.next/static
  - from: public
    to: next-standalone/public
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: Industry-Research-Studio-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Industry Research Studio
portable:
  artifactName: Industry-Research-Studio-Portable-${version}-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.productivity
  identity: null
  artifactName: Industry-Research-Studio-${version}-${arch}.${ext}
linux:
  target: [AppImage]
  category: Office
